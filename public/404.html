  <script>
  /* Theme gate: applies the saved or OS theme and the saved accent before first paint */
  (function(){var d=document.documentElement,t=null,a=null;d.classList.add('js');
  try{t=localStorage.getItem('theme');a=localStorage.getItem('accent')}catch(e){} /* storage may be blocked: fall through to the OS preference */
  d.dataset.theme=t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');if(a)d.dataset.accent=a;
  /* Fonts: attach the preloaded stylesheet from script so it never blocks the first paint (the noscript tag covers scripting-off) */
  var f=document.createElement('link');f.rel='stylesheet';f.href='https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=JetBrains+Mono:wght@500..700&family=Plus+Jakarta+Sans:wght@400..700&display=swap';document.head.appendChild(f)})();
  </script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">

</svg>
<div class="atmosphere" aria-hidden="true">
  <span class="atmosphere__blob atmosphere__blob--1"></span>

</div>

<main class="notfound" id="main">

    <p class="notfound__code text-grad" aria-hidden="true">404</p>
    <h1 class="t-h2">Page not found</h1>
    <p class="text-muted">That page is not here. It may have moved, or the link may have a typo.</p>
    <a class="btn btn--primary btn--arrow" href="/">Back to home <svg class="icon" aria-hidden="true"><use href="#i-arrow-right"/></svg></a>
  </div>
</main>
