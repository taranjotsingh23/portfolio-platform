<!DOCTYPE html>
<!--
  Template for public/assets/img/og-image.png (the link-preview image LinkedIn shows when the address is pasted).
  Not part of the deployed site. To regenerate: open this file in a browser at 1200 x 630 and take a screenshot.
  Keep it to the name, the role line and the portrait: no numbers and no availability text.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Open Graph image template</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Plus+Jakarta+Sans:wght@400..700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; background: #050d17; }
    .card { position: relative; width: 1200px; height: 630px; overflow: hidden; font-family: "Plus Jakarta Sans", system-ui, sans-serif; color: #edf2f9;
      background:
        radial-gradient(circle 520px at 14% 4%, rgb(29 79 168 / 0.62), transparent),
        radial-gradient(circle 460px at 94% 20%, rgb(14 127 122 / 0.5), transparent),
        radial-gradient(circle 520px at 56% 118%, rgb(90 60 176 / 0.5), transparent),
        #050d17; }
    .dots { position: absolute; inset: 0; background-image: radial-gradient(circle at center, rgb(53 73 98 / 0.55) 1px, transparent 1.6px); background-size: 26px 26px;
      -webkit-mask-image: radial-gradient(ellipse 90% 80% at 40% 30%, #000, transparent 80%); mask-image: radial-gradient(ellipse 90% 80% at 40% 30%, #000, transparent 80%); }
    .text { position: absolute; left: 84px; top: 0; bottom: 0; display: grid; align-content: center; gap: 22px; width: 620px; }
    h1 { font-family: "Bricolage Grotesque", sans-serif; font-weight: 800; font-size: 128px; line-height: 0.94; letter-spacing: -0.04em;
      background: linear-gradient(100deg, #7bb4fc, #2fd8d0); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .role { font-family: "Bricolage Grotesque", sans-serif; font-weight: 600; font-size: 35px; line-height: 1.15; letter-spacing: -0.02em; white-space: nowrap; color: #edf2f9; }
    .stage { position: absolute; right: 36px; bottom: 0; width: 470px; height: 590px; }
    .blob { position: absolute; left: 24px; right: 24px; top: 96px; height: 410px; border-radius: 48% 52% 46% 54%; background: linear-gradient(150deg, #7bb4fc, #4fc8f0 55%, #2fd8d0); box-shadow: 0 40px 90px -20px rgb(123 180 252 / 0.45); }
    .ring { position: absolute; left: -6px; top: 70px; width: 482px; height: 482px; border-radius: 50%; border: 2px dashed rgb(123 180 252 / 0.45); }
    img { position: absolute; left: 50%; bottom: 0; height: 580px; transform: translateX(-50%);
      -webkit-mask-image: linear-gradient(to bottom, #000 80%, transparent 99%), linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%);
      -webkit-mask-composite: source-in; mask-image: linear-gradient(to bottom, #000 80%, transparent 99%), linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%); mask-composite: intersect; }
  </style>
</head>
<body>
  <div class="card">
    <div class="dots"></div>
    <div class="text">
      <h1>Taranjot Singh</h1>
      <p class="role">Data Analytics &amp; Machine Learning</p>
    </div>
    <div class="stage">
      <div class="ring"></div>
      <div class="blob"></div>
      <img src="../public/assets/img/profile-960.webp" alt="">
    </div>
  </div>
</body>
</html>
